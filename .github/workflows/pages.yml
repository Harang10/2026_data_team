# main에 푸시하면 farm-insight/dist를 GitHub Pages로 배포한다.
# 처음 한 번: 저장소 Settings → Pages → Source를 "GitHub Actions"로 설정.
name: Deploy farm-insight to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['farm-insight/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tests
        run: npm test
        working-directory: farm-insight
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: farm-insight/dist
      - id: deployment
        uses: actions/deploy-pages@v4
